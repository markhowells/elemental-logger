# Installed by marine-apply as /etc/systemd/journald.conf.d/50-marine-persistent.conf — do not edit.
# Raspberry Pi OS ships Storage=volatile in /usr/lib/systemd/journald.conf.d/, which loses the logs
# at every reboot even when /var/log/journal exists. This file sorts after it and wins.
[Journal]
Storage=persistent
SystemMaxUse=200M
