# Reusable: build the SignalK image for arm64 (native runner) and amd64, optionally push to
# Docker Hub as one multi-arch manifest. Called by ci.yml and release.yml.
name: build-image

on:
  workflow_call:
    inputs:
      push:
        description: "Push to Docker Hub"
        type: boolean
        default: false
      tags:
        description: "Newline-separated extra tags (e.g. v1.2.3, latest). The sha-<commit> tag is always added when pushing."
        type: string
        default: ""
    outputs:
      digest:
        description: "Multi-arch manifest digest (empty when not pushed)"
        value: ${{ jobs.merge.outputs.digest }}
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/elemental-signalk

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # native arm64: no QEMU. If unavailable for your account, use ubuntu-latest + docker/setup-qemu-action.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned versions
        run: |
          set -a; . images/signalk/plugin.version; set +a
          { echo "SIGNALK_BASE=$SIGNALK_BASE"; echo "PLUGIN_REPO=$PLUGIN_REPO"; echo "PLUGIN_REF=$PLUGIN_REF"; } >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/signalk
          file: images/signalk/Dockerfile
          platforms: ${{ matrix.platform }}
          # Named only for the local (non-push) build, so the smoke test can refer to it.
          tags: ${{ !inputs.push && 'elemental-signalk:ci' || '' }}
          build-args: |
            SIGNALK_BASE=${{ env.SIGNALK_BASE }}
            PLUGIN_REPO=${{ env.PLUGIN_REPO }}
            PLUGIN_REF=${{ env.PLUGIN_REF }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # push by digest when publishing; otherwise load locally (amd64 only, for the smoke test)
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker,dest=/tmp/image.tar' }}
      - if: inputs.push
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
      - if: ${{ !inputs.push && matrix.platform == 'linux/amd64' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-amd64
          path: /tmp/image.tar

  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - if: inputs.push
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - if: inputs.push
        uses: docker/setup-buildx-action@v3
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: inputs.push
        name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags="-t ${IMAGE}:sha-${GITHUB_SHA::7}"
          while IFS= read -r t; do [ -n "$t" ] && tags="$tags -t ${IMAGE}:$t"; done <<'EXTRA'
          ${{ inputs.tags }}
          EXTRA
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)
      - if: inputs.push
        id: inspect
        run: |
          d="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${d}" >> "$GITHUB_STEP_SUMMARY"
